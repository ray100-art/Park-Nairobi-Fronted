<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkNairobi – Driver Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --gold: #F5C842; --black: #0A0A0F; --surface: #111118;
            --surface2: #1A1A24; --border: #2a2a38; --text: #F0EDE8; --muted: #7A7A90;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--black); min-height: 100vh; display: flex; overflow: hidden; }

        .left-panel { width: 55%; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 60px; }
        .left-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(245,200,66,0.12) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(245,200,66,0.06) 0%, transparent 50%); }
        .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(245,200,66,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(245,200,66,0.04) 1px, transparent 1px); background-size: 60px 60px; }
        .float-icons { position: absolute; inset: 0; pointer-events: none; }
        .float-icon { position: absolute; font-size: 1.2rem; color: var(--gold); opacity: 0.15; animation: floatUp 8s infinite linear; }
        .float-icon:nth-child(1) { left: 10%; animation-delay: 0s;   font-size: 2rem; }
        .float-icon:nth-child(2) { left: 25%; animation-delay: 1.5s; font-size: 1rem; }
        .float-icon:nth-child(3) { left: 45%; animation-delay: 3s;   font-size: 1.5rem; }
        .float-icon:nth-child(4) { left: 65%; animation-delay: 0.8s; font-size: 0.9rem; }
        .float-icon:nth-child(5) { left: 80%; animation-delay: 2.2s; font-size: 1.8rem; }
        .float-icon:nth-child(6) { left: 5%;  animation-delay: 4s;   font-size: 1.3rem; }
        .float-icon:nth-child(7) { left: 55%; animation-delay: 5s;   font-size: 1rem; }
        .float-icon:nth-child(8) { left: 35%; animation-delay: 6s;   font-size: 2.2rem; opacity: 0.08; }
        @keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.15; } 90% { opacity: 0.15; } 100% { transform: translateY(-20vh) rotate(20deg); opacity: 0; } }

        .left-content { position: relative; z-index: 2; }
        .brand-mark { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 60px; }
        .brand-p { width: 52px; height: 52px; background: var(--gold); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.6rem; color: var(--black); }
        .brand-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.3rem; color: var(--text); }
        .brand-name span { color: var(--gold); }
        .hero-heading { font-family: 'Syne', sans-serif; font-size: clamp(2.8rem,4vw,4.5rem); font-weight: 800; line-height: 1.0; color: var(--text); letter-spacing: -2px; margin-bottom: 24px; }
        .hero-heading .accent { color: var(--gold); display: block; }
        .hero-sub { font-size: 1.05rem; color: var(--muted); line-height: 1.7; max-width: 400px; margin-bottom: 48px; font-weight: 300; }
        .stats-row { display: flex; gap: 40px; }
        .stat { border-left: 2px solid var(--gold); padding-left: 16px; }
        .stat-num { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--gold); line-height: 1; }
        .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

        .right-panel { width: 45%; background: var(--surface); display: flex; align-items: center; justify-content: center; padding: 40px; border-left: 1px solid var(--border); position: relative; }
        .right-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .form-box { width: 100%; max-width: 380px; }
        .form-title { font-family: 'Syne', sans-serif; font-size: 1.9rem; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: -0.5px; }
        .form-subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }

        .tab-switcher { display: flex; background: var(--surface2); border-radius: 12px; padding: 4px; margin-bottom: 28px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; border-radius: 9px; cursor: pointer; transition: all 0.25s; }
        .tab-btn.active { background: var(--gold); color: var(--black); font-weight: 600; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.8px; }
        .field input { width: 100%; padding: 13px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,200,66,0.1); }
        .field input::placeholder { color: #3a3a50; }

        .submit-btn { width: 100%; padding: 14px; background: var(--gold); color: var(--black); border: none; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .submit-btn:hover { background: #e8b830; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(245,200,66,0.25); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn.loading { opacity: 0.7; pointer-events: none; }

        .alert-box { padding: 12px 16px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 18px; display: none; align-items: center; gap: 10px; }
        .alert-box.error   { background: rgba(220,53,69,0.12); border: 1px solid rgba(220,53,69,0.3); color: #ff6b7a; display: flex; }
        .alert-box.success { background: rgba(25,135,84,0.12); border: 1px solid rgba(25,135,84,0.3); color: #4ade80; display: flex; }

        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .divider-line { flex: 1; height: 1px; background: var(--border); }
        .divider-text { color: var(--muted); font-size: 0.78rem; }

        @media (max-width: 768px) { body { flex-direction: column; overflow: auto; } .left-panel { width: 100%; padding: 40px 30px 30px; min-height: auto; } .right-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); } .stats-row { gap: 24px; } .hero-heading { font-size: 2.4rem; } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="left-panel">
    <div class="grid-bg"></div>
    <div class="float-icons">
        <span class="float-icon"><i class="bi bi-car-front-fill"></i></span>
        <span class="float-icon"><i class="bi bi-p-square-fill"></i></span>
        <span class="float-icon"><i class="bi bi-geo-alt-fill"></i></span>
        <span class="float-icon"><i class="bi bi-car-front"></i></span>
        <span class="float-icon"><i class="bi bi-map-fill"></i></span>
        <span class="float-icon"><i class="bi bi-clock-fill"></i></span>
        <span class="float-icon"><i class="bi bi-shield-check"></i></span>
        <span class="float-icon"><i class="bi bi-p-circle-fill"></i></span>
    </div>
    <div class="left-content">
        <div class="brand-mark">
            <div class="brand-p">P</div>
            <div class="brand-name">Park<span>Nairobi</span></div>
        </div>
        <h1 class="hero-heading">Find Your<br><span class="accent">Perfect Spot</span>In Seconds.</h1>
        <p class="hero-sub">Real-time parking slots across Kenya. Reserve instantly, arrive confidently.</p>
        <div class="stats-row">
            <div class="stat"><div class="stat-num">46+</div><div class="stat-label">Slots</div></div>
            <div class="stat"><div class="stat-num">11</div><div class="stat-label">Locations</div></div>
            <div class="stat"><div class="stat-num">15m</div><div class="stat-label">Reserve Time</div></div>
        </div>
    </div>
</div>

<div class="right-panel">
    <div class="form-box">
        <div class="form-title" id="formTitle">Welcome back</div>
        <div class="form-subtitle" id="formSubtitle">Sign in to find and book parking</div>

        <div class="tab-switcher">
            <button class="tab-btn active" id="loginTab" onclick="showTab('login')">Sign In</button>
            <button class="tab-btn" id="registerTab" onclick="showTab('register')">Create Account</button>
        </div>

        <div class="alert-box" id="alertBox">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span id="alertText"></span>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••"
                       onkeydown="if(event.key==='Enter') login()">
            </div>
            <button class="submit-btn" id="loginBtn" onclick="login()">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display:none">
            <div class="field">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="John Doe" autocomplete="name">
            </div>
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="field">
                <label>Phone Number</label>
                <input type="tel" id="regPhone" placeholder="+254711000000" autocomplete="tel">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="••••••••"
                       onkeydown="if(event.key==='Enter') register()">
            </div>
            <button class="submit-btn" id="registerBtn" onclick="register()">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </div>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">SECURE LOGIN</span>
            <div class="divider-line"></div>
        </div>
        <div style="text-align:center; color: var(--muted); font-size: 0.78rem;">
            <i class="bi bi-shield-lock"></i> Your data is protected with JWT encryption
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080';

    function getToken() { return localStorage.getItem('token'); }
    function getUser()  { const u = localStorage.getItem('user'); return u ? JSON.parse(u) : null; }

    // Redirect if already logged in
    if (getToken()) { window.location.href = 'dashboard.html'; }

    function showTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('loginForm').style.display    = isLogin ? 'block' : 'none';
        document.getElementById('registerForm').style.display = isLogin ? 'none'  : 'block';
        document.getElementById('loginTab').classList.toggle('active', isLogin);
        document.getElementById('registerTab').classList.toggle('active', !isLogin);
        document.getElementById('formTitle').textContent    = isLogin ? 'Welcome back' : 'Create account';
        document.getElementById('formSubtitle').textContent = isLogin ? 'Sign in to find and book parking' : 'Join ParkNairobi today';
        hideAlert();
    }

    function showAlert(msg, type = 'error') {
        const box = document.getElementById('alertBox');
        box.className = 'alert-box ' + type;
        document.getElementById('alertText').textContent = msg;
        box.style.display = 'flex';
    }
    function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }

    function setLoading(btnId, loading, label) {
        const btn = document.getElementById(btnId);
        btn.classList.toggle('loading', loading);
        btn.innerHTML = loading
            ? '<span style="width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;display:inline-block;animation:spin 0.6s linear infinite"></span>&nbsp;Please wait...'
            : label;
    }

    async function login() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) { showAlert('Please fill in all fields'); return; }

        setLoading('loginBtn', true, '');
        hideAlert();
        try {
            const res = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success || data.token) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    fullName: data.fullName,
                    role: data.role,
                    userId: data.userId
                }));
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = data.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
                }, 800);
            } else {
                showAlert(data.message || 'Invalid email or password');
                setLoading('loginBtn', false, '<i class="bi bi-box-arrow-in-right"></i> Sign In');
            }
        } catch (err) {
            showAlert('Cannot connect to server. Is Spring Boot running on port 8080?');
            setLoading('loginBtn', false, '<i class="bi bi-box-arrow-in-right"></i> Sign In');
        }
    }

    async function register() {
        const fullName = document.getElementById('regName').value.trim();
        const email    = document.getElementById('regEmail').value.trim();
        const phone    = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!fullName || !email || !phone || !password) { showAlert('Please fill in all fields'); return; }
        if (!email.includes('@')) { showAlert('Please enter a valid email'); return; }
        if (password.length < 8) { showAlert('Password must be at least 8 characters'); return; }

        setLoading('registerBtn', true, '');
        hideAlert();
        try {
            const res = await fetch(`${API_BASE}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, phone, password, role: 'DRIVER' })
            });
            const data = await res.json();
            if (data.success || data.token) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    fullName: data.fullName,
                    role: data.role,
                    userId: data.userId
                }));
                showAlert('Account created! Redirecting...', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
            } else {
                showAlert(data.message || 'Registration failed. Try a different email.');
                setLoading('registerBtn', false, '<i class="bi bi-person-plus"></i> Create Account');
            }
        } catch (err) {
            showAlert('Cannot connect to server. Is Spring Boot running on port 8080?');
            setLoading('registerBtn', false, '<i class="bi bi-person-plus"></i> Create Account');
        }
    }
</script>
</body>
</html>
