<script>
const API_BASE = 'http://localhost:8080';
function getToken()    { return localStorage.getItem('token'); }
function getUser()     { try { return JSON.parse(localStorage.getItem('user')); } catch(e) { return null; } }
function doLogout()    { localStorage.clear(); window.location.href = 'index.html'; }
function authHeaders() { return { 'Content-Type':'application/json', 'Authorization':'Bearer ' + getToken() }; }

document.addEventListener('DOMContentLoaded', function() {
    if (!getToken()) { window.location.href = 'index.html'; return; }
    loadProfile();
    loadBookings();
});

async function loadProfile() {
    var cached = getUser();
    if (cached) fillUI(cached);
    try {
        var res = await fetch(API_BASE + '/api/profile', { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) {
            localStorage.clear(); window.location.href = 'index.html'; return;
        }
        var data = await res.json();
        if (data && (data.id || data.email)) {
            var fresh = {
                id:       data.id       || (cached ? cached.id       : ''),
                fullName: data.fullName || (cached ? cached.fullName : ''),
                email:    data.email    || (cached ? cached.email    : ''),
                phone:    data.phone    || (cached ? cached.phone    : ''),
                role:     data.role     || (cached ? cached.role     : 'DRIVER')
            };
            localStorage.setItem('user', JSON.stringify(fresh));
            fillUI(fresh);
        }
    } catch(e) { console.warn('Profile API unreachable'); }
}

function fillUI(user) {
    var name = user.fullName || '';
    var initials = name.trim()
        ? name.trim().split(' ').map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,2)
        : (user.email ? user.email[0].toUpperCase() : '?');
    document.getElementById('heroAvatar').textContent = initials;
    document.getElementById('heroName').textContent   = name || 'Driver';
    document.getElementById('heroEmail').textContent  = user.email || '';
    document.getElementById('heroRole').textContent   = user.role  || 'DRIVER';
    document.getElementById('inputName').value        = name;
    document.getElementById('inputEmail').value       = user.email || '';
    document.getElementById('inputPhone').value       = user.phone || '';
}

async function loadBookings() {
    try {
        var res      = await fetch(API_BASE + '/api/bookings/my', { headers: authHeaders() });
        var data     = await res.json();
        var bookings = Array.isArray(data) ? data : [];
        document.getElementById('statTotal').textContent  = bookings.length;
        document.getElementById('statActive').textContent = bookings.filter(function(b){ return b.status === 'ACTIVE'; }).length;
        document.getElementById('statPaid').textContent   = bookings.filter(function(b){ return b.paymentStatus === 'PAID'; }).length;
        var recent = bookings.slice(0, 5);
        if (!recent.length) {
            document.getElementById('recentBookings').innerHTML =
                '<div class="empty-bookings"><i class="bi bi-calendar-x"></i><p>No bookings yet</p></div>';
            return;
        }
        document.getElementById('recentBookings').innerHTML = recent.map(function(b) {
            var date = b.reservedAt
                ? new Date(b.reservedAt).toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' })
                : 'N/A';
            return '<div class="booking-row">' +
                '<div class="booking-slot">' + (b.slotId || 'N/A') + '</div>' +
                '<div class="booking-area"><i class="bi bi-building" style="margin-right:4px;color:var(--muted)"></i>' + (b.parkingAreaName || 'Parking Area') + '</div>' +
                '<div class="booking-date">' + date + '</div>' +
                '<span class="b-status b-' + b.status + '">' + b.status + '</span>' +
                '</div>';
        }).join('');
    } catch(e) {
        document.getElementById('recentBookings').innerHTML =
            '<div class="empty-bookings"><i class="bi bi-wifi-off"></i><p>Could not load bookings</p></div>';
    }
}

async function saveProfile() {
    var name    = document.getElementById('inputName').value.trim();
    var email   = document.getElementById('inputEmail').value.trim();
    var phone   = document.getElementById('inputPhone').value.trim();
    var alertEl = document.getElementById('profileAlert');
    if (!name)  { showAlert(alertEl, 'error', 'Full name is required'); return; }
    if (!email) { showAlert(alertEl, 'error', 'Email is required'); return; }
    if (!phone) { showAlert(alertEl, 'error', 'Phone number is required'); return; }
    var btn = document.getElementById('saveProfileBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving...';
    try {
        var res  = await fetch(API_BASE + '/api/profile', {
            method: 'PUT', headers: authHeaders(),
            body: JSON.stringify({ fullName: name, email: email, phone: phone })
        });
        var data = await res.json();
        if (res.ok && data.success) {
            var cached = getUser() || {};
            var updated = {
                id:       data.id       || cached.id   || '',
                fullName: data.fullName || name,
                email:    data.email    || email,
                phone:    data.phone    || phone,
                role:     data.role     || cached.role || 'DRIVER'
            };
            localStorage.setItem('user', JSON.stringify(updated));
            fillUI(updated);
            showAlert(alertEl, 'success', 'Profile updated successfully!');
            showToast('Profile saved', 'success');
        } else {
            showAlert(alertEl, 'error', data.message || 'Failed to update. Try again.');
        }
    } catch(e) {
        showAlert(alertEl, 'error', 'Connection error - is Spring Boot running on port 8080?');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-floppy-fill"></i> Save Changes';
    }
}

async function changePassword() {
    var current = document.getElementById('currentPw').value;
    var newPw   = document.getElementById('newPw').value;
    var confirm = document.getElementById('confirmPw').value;
    var alertEl = document.getElementById('pwAlert');
    if (!current)                    { showAlert(alertEl, 'error', 'Enter your current password'); return; }
    if (newPw.length < 8)            { showAlert(alertEl, 'error', 'New password must be at least 8 characters'); return; }
    if (!/[0-9]/.test(newPw))        { showAlert(alertEl, 'error', 'New password must contain at least one number'); return; }
    if (newPw !== confirm)           { showAlert(alertEl, 'error', 'Passwords do not match'); return; }
    var btn = document.getElementById('savePwBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Updating...';
    try {
        var res  = await fetch(API_BASE + '/api/profile/password', {
            method: 'PUT', headers: authHeaders(),
            body: JSON.stringify({ currentPassword: current, newPassword: newPw })
        });
        var data = await res.json();
        if (res.ok && data.success) {
            document.getElementById('currentPw').value = '';
            document.getElementById('newPw').value     = '';
            document.getElementById('confirmPw').value = '';
            document.getElementById('pwBarFill').style.width = '0';
            document.getElementById('pwHint').textContent    = '';
            showAlert(alertEl, 'success', 'Password changed successfully!');
            showToast('Password updated', 'success');
        } else {
            showAlert(alertEl, 'error', data.message || 'Wrong current password');
        }
    } catch(e) {
        showAlert(alertEl, 'error', 'Connection error - is Spring Boot running?');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-lock-fill"></i> Update Password';
    }
}

function checkStrength(pw) {
    var fill = document.getElementById('pwBarFill');
    var hint = document.getElementById('pwHint');
    if (!pw) { fill.style.width = '0'; hint.textContent = ''; return; }
    var score = 0;
    if (pw.length >= 8)           score++;
    if (pw.length >= 12)          score++;
    if (/[0-9]/.test(pw))         score++;
    if (/[A-Z]/.test(pw))         score++;
    if (/[^a-zA-Z0-9]/.test(pw))  score++;
    var levels = [
        { w:'15%',  bg:'#ef4444', label:'Too weak' },
        { w:'35%',  bg:'#f97316', label:'Weak' },
        { w:'55%',  bg:'#eab308', label:'Fair' },
        { w:'75%',  bg:'#84cc16', label:'Good' },
        { w:'100%', bg:'#22c55e', label:'Strong!' }
    ];
    var level = levels[Math.min(score, 4)];
    fill.style.width      = level.w;
    fill.style.background = level.bg;
    hint.textContent      = level.label;
    hint.style.color      = level.bg;
}

function togglePw(inputId, btn) {
    var input = document.getElementById(inputId);
    var show  = input.type === 'password';
    input.type    = show ? 'text' : 'password';
    btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
}

function showAlert(el, type, msg) {
    el.className = 'alert ' + type;
    el.innerHTML = '<i class="bi bi-' + (type === 'success' ? 'check-circle-fill' : 'exclamation-circle-fill') + '"></i> ' + msg;
    setTimeout(function(){ el.className = 'alert'; }, 5000);
}

function showToast(message, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast ' + (type || 'success');
    t.textContent = message;
    c.appendChild(t);
    setTimeout(function(){ t.remove(); }, 4000);
}
