<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — ParkNairobi</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --gold:#F5C842; --black:#0A0A0F; --surface:#111118; --surface2:#1A1A24;
            --border:#2a2a38; --text:#F0EDE8; --muted:#7A7A90;
            --green:#22c55e; --red:#ef4444; --orange:#f97316;
        }
        body.light {
            --black:#F0F2F5; --surface:#FFFFFF; --surface2:#F0F2F5;
            --border:#D8DCE3; --text:#0A0A0F; --muted:#6B7280;
        }
        .theme-btn { height:36px; width:36px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1rem; transition:all 0.2s; flex-shrink:0; }
        .theme-btn:hover { border-color:var(--gold); color:var(--gold); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--black); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

        /* ── Navbar ── */
        .navbar { height:60px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:12px; flex-shrink:0; }
        .nav-brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
        .nav-p { width:36px; height:36px; background:var(--gold); border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; color:var(--black); }
        .nav-title { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; color:var(--text); }
        .nav-title span { color:var(--gold); }
        .nav-spacer { flex:1; }
        .nav-btn { height:36px; padding:0 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.83rem; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.2s; text-decoration:none; }
        .nav-btn:hover { border-color:var(--gold); color:var(--gold); }
        .nav-btn.gold { background:var(--gold); color:var(--black); border-color:var(--gold); font-weight:600; }
        .nav-user { display:flex; align-items:center; gap:8px; padding:4px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; }
        .nav-avatar { width:28px; height:28px; background:var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:700; font-size:0.75rem; color:var(--black); }
        .nav-username { font-size:0.83rem; color:var(--text); }

        /* ── Page ── */
        .page { flex:1; display:flex; justify-content:center; padding:40px 20px; }
        .container { width:100%; max-width:640px; display:flex; flex-direction:column; gap:20px; }

        /* ── Card ── */
        .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
        .card-header { padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
        .card-header i { color:var(--gold); font-size:1.1rem; }
        .card-title { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; }
        .card-body { padding:22px; }

        /* ── Avatar block ── */
        .avatar-block { display:flex; align-items:center; gap:18px; margin-bottom:24px; }
        .big-avatar { width:64px; height:64px; background:var(--gold); border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:1.6rem; color:var(--black); flex-shrink:0; }
        .avatar-info { display:flex; flex-direction:column; gap:4px; }
        .avatar-name { font-family:'Syne',sans-serif; font-weight:700; font-size:1.1rem; }
        .avatar-role { font-size:0.78rem; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:2px 10px; display:inline-block; }

        /* ── Form ── */
        .form-group { margin-bottom:16px; position:relative; }
        .form-group label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
        .form-group input { width:100%; padding:10px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:9px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.9rem; outline:none; transition:border-color 0.2s; }
        .form-group input:focus { border-color:var(--gold); }
        .form-group input:disabled { opacity:0.5; cursor:not-allowed; }
        .pw-wrap { position:relative; }
        .pw-wrap input { padding-right:42px; }
        .pw-eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; }
        .pw-eye:hover { color:var(--gold); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

        /* ── Password strength ── */
        .pw-bar { height:4px; background:var(--border); border-radius:2px; margin-top:8px; }
        .pw-bar-fill { height:100%; border-radius:2px; width:0; transition:all 0.3s; }
        .pw-hint { font-size:0.72rem; margin-top:4px; }

        /* ── Buttons ── */
        .btn { height:40px; padding:0 20px; border-radius:9px; border:none; font-family:'Syne',sans-serif; font-weight:700; font-size:0.85rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:all 0.2s; }
        .btn-gold { background:var(--gold); color:var(--black); }
        .btn-gold:hover { background:#e8b830; }
        .btn-gold:disabled { opacity:0.6; cursor:not-allowed; }
        .btn-danger { background:transparent; border:1px solid rgba(239,68,68,.3); color:var(--red); }
        .btn-danger:hover { background:rgba(239,68,68,.1); }
        .btn-row { display:flex; gap:10px; margin-top:6px; }

        /* ── Alert ── */
        .alert { padding:11px 14px; border-radius:9px; font-size:0.85rem; margin-bottom:14px; display:none; align-items:center; gap:8px; }
        .alert.success { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3); color:var(--green); display:flex; }
        .alert.error   { background:rgba(239,68,68,.1);  border:1px solid rgba(239,68,68,.3);  color:var(--red);   display:flex; }

        /* ── Stats ── */
        .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .stat-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
        .stat-value { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; color:var(--gold); }
        .stat-label { font-size:0.75rem; color:var(--muted); margin-top:4px; }

        /* ── Spinner ── */
        .spinner { width:14px; height:14px; border:2px solid rgba(0,0,0,0.2); border-top-color:#000; border-radius:50%; display:inline-block; animation:spin 0.6s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ── Toast ── */
        .toast-container { position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:8px; z-index:9999; }
        .toast { padding:12px 18px; border-radius:10px; font-size:0.85rem; display:flex; align-items:center; gap:8px; animation:slideIn .25s ease; }
        .toast.success { background:#166534; border:1px solid #22c55e; color:#bbf7d0; }
        .toast.error   { background:#7f1d1d; border:1px solid #ef4444; color:#fecaca; }
        @keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        @media(max-width:500px) { .form-row { grid-template-columns:1fr; } .stats-grid { grid-template-columns:1fr 1fr; } }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="nav-brand">
        <div class="nav-p">P</div>
        <div class="nav-title">Park<span>Nairobi</span></div>
    </a>
    <div class="nav-spacer"></div>
    <a href="dashboard.html" class="nav-btn gold">
        <i class="bi bi-map"></i> Find Parking
    </a>
    <a href="bookings.html" class="nav-btn">
        <i class="bi bi-calendar-check"></i> Bookings
    </a>
    <div class="nav-user">
        <div class="nav-avatar" id="navAvatar">?</div>
        <span class="nav-username" id="navUsername">Driver</span>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>
    <button class="nav-btn" onclick="logout()" style="border-color:rgba(239,68,68,0.3);color:#ef4444">
        <i class="bi bi-box-arrow-right"></i>
    </button>
</nav>

<div class="page">
    <div class="container">

        <!-- Stats -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-bar-chart-fill"></i>
                <span class="card-title">My Activity</span>
            </div>
            <div class="card-body">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statTotal">—</div>
                        <div class="stat-label">Total Bookings</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statActive" style="color:var(--green)">—</div>
                        <div class="stat-label">Active</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statPaid" style="color:var(--gold)">—</div>
                        <div class="stat-label">Paid</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Profile -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-fill"></i>
                <span class="card-title">Profile Details</span>
            </div>
            <div class="card-body">
                <div class="avatar-block">
                    <div class="big-avatar" id="heroAvatar">?</div>
                    <div class="avatar-info">
                        <div class="avatar-name" id="heroName">Loading...</div>
                        <div style="font-size:0.78rem;color:var(--muted)" id="heroEmail"></div>
                        <span class="avatar-role" id="heroRole">DRIVER</span>
                    </div>
                </div>

                <div class="alert" id="profileAlert"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="inputName" placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="inputPhone" placeholder="e.g. 0712345678">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="inputEmail" disabled>
                </div>

                <div class="btn-row">
                    <button class="btn btn-gold" id="saveProfileBtn" onclick="saveProfile()">
                        <i class="bi bi-floppy-fill"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>

        <!-- Change Password -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-shield-lock-fill"></i>
                <span class="card-title">Change Password</span>
            </div>
            <div class="card-body">
                <div class="alert" id="pwAlert"></div>

                <div class="form-group">
                    <label>Current Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="currentPw" placeholder="Enter current password">
                        <button class="pw-eye" onclick="togglePw('currentPw', this)"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>New Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="newPw" placeholder="Min 8 characters" oninput="checkStrength(this.value)">
                            <button class="pw-eye" onclick="togglePw('newPw', this)"><i class="bi bi-eye"></i></button>
                        </div>
                        <div class="pw-bar"><div class="pw-bar-fill" id="pwBarFill"></div></div>
                        <div class="pw-hint" id="pwHint"></div>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="confirmPw" placeholder="Repeat new password">
                            <button class="pw-eye" onclick="togglePw('confirmPw', this)"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                </div>

                <div class="btn-row">
                    <button class="btn btn-gold" id="savePwBtn" onclick="changePassword()">
                        <i class="bi bi-lock-fill"></i> Update Password
                    </button>
                </div>
            </div>
        </div>

        <!-- Session -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-box-arrow-right" style="color:var(--red)"></i>
                <span class="card-title">Session</span>
            </div>
            <div class="card-body">
                <p style="font-size:.85rem;color:var(--muted);margin-bottom:16px">You are currently signed in. Logging out will clear your session from this device.</p>
                <button class="btn btn-danger" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Log Out
                </button>
            </div>
        </div>

    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
    // ── Theme ────────────────────────────────────
    (function() {
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    })();

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        document.getElementById('themeIcon').className = isLight ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (!getToken()) { window.location.href = 'index.html'; return; }
        if (localStorage.getItem('theme') === 'light') {
            document.getElementById('themeIcon').className = 'bi bi-moon-fill';
        }

        // Pre-fill from localStorage immediately so page doesn't look blank
        var cached = getUser();
        if (cached) {
            fillUI(cached);
            var nav = (cached.fullName || '?').charAt(0).toUpperCase();
            document.getElementById('navAvatar').textContent   = nav;
            document.getElementById('navUsername').textContent = cached.fullName || 'Driver';
        }

        loadProfile();
        loadBookings();
    });

    async function loadProfile() {
        try {
            var res = await apiFetch(API_BASE + '/api/profile', { headers: authHeaders() });
            if (res.status === 401 || res.status === 403) { logout(); return; }
            var data = await res.json();
            if (data && (data.id || data.email)) {
                var cached = getUser() || {};
                var fresh = {
                    id:       data.id       || cached.id       || '',
                    fullName: data.fullName || cached.fullName || '',
                    email:    data.email    || cached.email    || '',
                    phone:    data.phone    || cached.phone    || '',
                    role:     data.role     || cached.role     || 'DRIVER'
                };
                localStorage.setItem('user', JSON.stringify(fresh));
                fillUI(fresh);
                document.getElementById('navAvatar').textContent   = (fresh.fullName || '?').charAt(0).toUpperCase();
                document.getElementById('navUsername').textContent = fresh.fullName || 'Driver';
            }
        } catch(e) { console.warn('Profile API unreachable', e); }
    }

    function fillUI(user) {
        var name = user.fullName || '';
        var initials = name.trim()
            ? name.trim().split(' ').map(function(w){ return w[0]; }).join('').toUpperCase().slice(0, 2)
            : (user.email ? user.email[0].toUpperCase() : '?');
        document.getElementById('heroAvatar').textContent = initials;
        document.getElementById('heroName').textContent   = name || 'Driver';
        document.getElementById('heroEmail').textContent  = user.email || '';
        document.getElementById('heroRole').textContent   = user.role  || 'DRIVER';
        document.getElementById('inputName').value        = name;
        document.getElementById('inputEmail').value       = user.email || '';
        document.getElementById('inputPhone').value       = user.phone || '';
    }

    async function loadBookings() {
        try {
            var bookings = await apiGetMyBookings();
            document.getElementById('statTotal').textContent  = bookings.length;
            document.getElementById('statActive').textContent = bookings.filter(function(b){ return b.status === 'ACTIVE' || b.status === 'CONFIRMED'; }).length;
            document.getElementById('statPaid').textContent   = bookings.filter(function(b){ return b.paymentStatus === 'PAID'; }).length;
        } catch(e) { /* non-critical */ }
    }

    async function saveProfile() {
        var name    = document.getElementById('inputName').value.trim();
        var phone   = document.getElementById('inputPhone').value.trim();
        var alertEl = document.getElementById('profileAlert');
        if (!name) { showAlert(alertEl, 'error', 'Full name is required'); return; }
        var btn = document.getElementById('saveProfileBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Saving...';
        try {
            var res  = await apiFetch(API_BASE + '/api/profile', {
                method: 'PUT', headers: authHeaders(),
                body: JSON.stringify({ fullName: name, phone: phone })
            });
            var data = await res.json();
            if (res.ok) {
                var cached = getUser() || {};
                cached.fullName = name;
                cached.phone    = phone;
                localStorage.setItem('user', JSON.stringify(cached));
                fillUI(cached);
                document.getElementById('navAvatar').textContent   = name.charAt(0).toUpperCase();
                document.getElementById('navUsername').textContent = name;
                showAlert(alertEl, 'success', 'Profile updated successfully!');
                showToast('Profile saved', 'success');
            } else {
                showAlert(alertEl, 'error', data.message || 'Failed to update. Try again.');
            }
        } catch(e) {
            showAlert(alertEl, 'error', 'Connection error — is Spring Boot running on port 8080?');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-floppy-fill"></i> Save Changes';
        }
    }

    async function changePassword() {
        var current = document.getElementById('currentPw').value;
        var newPw   = document.getElementById('newPw').value;
        var confirm = document.getElementById('confirmPw').value;
        var alertEl = document.getElementById('pwAlert');
        if (!current)             { showAlert(alertEl, 'error', 'Enter your current password'); return; }
        if (newPw.length < 8)     { showAlert(alertEl, 'error', 'New password must be at least 8 characters'); return; }
        if (!/[0-9]/.test(newPw)) { showAlert(alertEl, 'error', 'New password must contain at least one number'); return; }
        if (newPw !== confirm)    { showAlert(alertEl, 'error', 'Passwords do not match'); return; }
        var btn = document.getElementById('savePwBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Updating...';
        try {
            var res  = await apiFetch(API_BASE + '/api/profile/password', {
                method: 'PUT', headers: authHeaders(),
                body: JSON.stringify({ currentPassword: current, newPassword: newPw })
            });
            var data = await res.json();
            if (res.ok && data.success) {
                document.getElementById('currentPw').value        = '';
                document.getElementById('newPw').value            = '';
                document.getElementById('confirmPw').value        = '';
                document.getElementById('pwBarFill').style.width  = '0';
                document.getElementById('pwHint').textContent     = '';
                showAlert(alertEl, 'success', 'Password changed successfully. Please sign in again.');
                showToast('Password updated — signing out');
                setTimeout(function() { logout(); }, 1500);
            } else {
                showAlert(alertEl, 'error', data.message || 'Wrong current password');
            }
        } catch(e) {
            showAlert(alertEl, 'error', 'Connection error — is Spring Boot running?');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-lock-fill"></i> Update Password';
        }
    }

    function checkStrength(pw) {
        var fill = document.getElementById('pwBarFill');
        var hint = document.getElementById('pwHint');
        if (!pw) { fill.style.width = '0'; hint.textContent = ''; return; }
        var score = 0;
        if (pw.length >= 8)           score++;
        if (pw.length >= 12)          score++;
        if (/[0-9]/.test(pw))         score++;
        if (/[A-Z]/.test(pw))         score++;
        if (/[^a-zA-Z0-9]/.test(pw))  score++;
        var levels = [
            { w:'15%',  bg:'#ef4444', label:'Too weak' },
            { w:'35%',  bg:'#f97316', label:'Weak' },
            { w:'55%',  bg:'#eab308', label:'Fair' },
            { w:'75%',  bg:'#84cc16', label:'Good' },
            { w:'100%', bg:'#22c55e', label:'Strong!' }
        ];
        var level = levels[Math.min(score, 4)];
        fill.style.width      = level.w;
        fill.style.background = level.bg;
        hint.textContent      = level.label;
        hint.style.color      = level.bg;
    }

    function togglePw(inputId, btn) {
        var input = document.getElementById(inputId);
        var show  = input.type === 'password';
        input.type    = show ? 'text' : 'password';
        btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    }

    function showAlert(el, type, msg) {
        el.className = 'alert ' + type;
        el.textContent = msg;
        setTimeout(function(){ el.className = 'alert'; }, 5000);
    }

    function showToast(message, type) {
        var c = document.getElementById('toastContainer');
        var t = document.createElement('div');
        t.className = 'toast ' + (type || 'success');
        t.appendChild(document.createTextNode(message));
        c.appendChild(t);
        setTimeout(function(){ t.remove(); }, 4000);
    }
</script>
</body>
</html>
