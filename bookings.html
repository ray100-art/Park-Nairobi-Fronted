<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkNairobi – My Bookings</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --gold: #F5C842; --black: #0A0A0F; --surface: #111118;
            --surface2: #1A1A24; --border: #2a2a38; --text: #F0EDE8;
            --muted: #7A7A90; --green: #22c55e; --red: #ef4444; --orange: #f97316;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--text); min-height: 100vh; }

        .navbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-p { width: 36px; height: 36px; background: var(--gold); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--black); }
        .nav-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); }
        .nav-title span { color: var(--gold); }
        .nav-spacer { flex: 1; }
        .nav-btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.83rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; text-decoration: none; }
        .nav-btn:hover { border-color: var(--gold); color: var(--gold); }
        .nav-btn.gold { background: var(--gold); color: var(--black); border-color: var(--gold); font-weight: 600; }
        .nav-btn.gold:hover { background: #e8b830; }

        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
        .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
        .page-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
        .page-title span { color: var(--gold); }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 14px; transition: border-color 0.2s; }
        .stat-card:hover { border-color: var(--gold); }
        .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .stat-num { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; line-height: 1; }
        .stat-lbl { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-tab { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.83rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .filter-tab:hover { border-color: var(--text); color: var(--text); }
        .filter-tab.active { background: var(--gold); border-color: var(--gold); color: var(--black); font-weight: 600; }

        .bookings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .booking-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: all 0.2s; }
        .booking-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .card-top { padding: 16px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .card-slot { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--gold); line-height: 1; margin-bottom: 4px; }
        .card-area { font-size: 0.78rem; color: var(--muted); }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
        .status-PENDING   { background: rgba(249,115,22,0.15); color: var(--orange); }
        .status-ACTIVE    { background: rgba(34,197,94,0.15);  color: var(--green); }
        .status-CANCELLED { background: rgba(239,68,68,0.15);  color: var(--red); }
        .status-COMPLETED { background: rgba(122,122,144,0.15); color: var(--muted); }
        .card-body { padding: 14px 16px; }
        .detail-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .detail-icon { width: 30px; height: 30px; background: var(--surface2); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--gold); flex-shrink: 0; }
        .detail-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-value { font-size: 0.88rem; color: var(--text); font-weight: 500; }
        .card-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
        .cancel-btn { width: 100%; padding: 9px; background: transparent; border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; color: var(--red); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .cancel-btn:hover { background: rgba(239,68,68,0.1); border-color: var(--red); }
        .active-badge { width: 100%; padding: 9px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; color: var(--green); font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
        .empty-state i { font-size: 3rem; margin-bottom: 16px; display: block; }
        .empty-state p { font-size: 0.95rem; margin-bottom: 20px; }
        .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .page-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="nav-brand">
        <div class="nav-p">P</div>
        <div class="nav-title">Park<span>Nairobi</span></div>
    </a>
    <div class="nav-spacer"></div>
    <a href="dashboard.html" class="nav-btn gold"><i class="bi bi-map"></i> Find Parking</a>
    <a href="profile.html" class="nav-btn"><i class="bi bi-person-fill"></i> Profile</a>
    <button class="nav-btn" onclick="logout()" style="border-color:rgba(239,68,68,0.3);color:#ef4444">
        <i class="bi bi-box-arrow-right"></i>
    </button>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <div class="page-title">My <span>Bookings</span></div>
            <div style="color:var(--muted);font-size:0.88rem;margin-top:4px">Track and manage your parking reservations</div>
        </div>
        <a href="dashboard.html" class="nav-btn gold" style="height:40px;padding:0 18px;font-size:0.9rem">
            <i class="bi bi-plus-circle"></i> New Booking
        </a>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-icon" style="background:rgba(245,200,66,0.1)"><i class="bi bi-calendar-check" style="color:var(--gold)"></i></div><div><div class="stat-num" id="sTotal" style="color:var(--text)">–</div><div class="stat-lbl">Total</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:rgba(34,197,94,0.1)"><i class="bi bi-check-circle" style="color:var(--green)"></i></div><div><div class="stat-num" id="sActive" style="color:var(--green)">–</div><div class="stat-lbl">Active</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:rgba(249,115,22,0.1)"><i class="bi bi-hourglass-split" style="color:var(--orange)"></i></div><div><div class="stat-num" id="sPending" style="color:var(--orange)">–</div><div class="stat-lbl">Pending</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:rgba(239,68,68,0.1)"><i class="bi bi-x-circle" style="color:var(--red)"></i></div><div><div class="stat-num" id="sCancelled" style="color:var(--red)">–</div><div class="stat-lbl">Cancelled</div></div></div>
    </div>

    <div class="filter-bar">
        <button class="filter-tab" id="tab-ALL"       onclick="filterBy('ALL')"><i class="bi bi-grid"></i> All</button>
        <button class="filter-tab"        id="tab-PENDING"   onclick="filterBy('PENDING')"><i class="bi bi-hourglass-split"></i> Pending</button>
        <button class="filter-tab active" id="tab-ACTIVE"    onclick="filterBy('ACTIVE')"><i class="bi bi-check-circle"></i> Active</button>
        <button class="filter-tab"        id="tab-CANCELLED" onclick="filterBy('CANCELLED')"><i class="bi bi-x-circle"></i> Cancelled</button>
    </div>

    <div id="content">
        <div class="loading-state">
            <div class="spinner"></div>
            <div style="font-size:0.88rem">Loading your bookings...</div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    let allBookings = [];

    document.addEventListener('DOMContentLoaded', () => {
        if (!getToken()) { window.location.href = 'index.html'; return; }
        loadBookings();
    });

    async function loadBookings() {
        try {
            const data = await apiGetMyBookings();
            allBookings = Array.isArray(data) ? data : [];
            updateStats(allBookings);
            filterBy('ACTIVE');
        } catch (e) {
            allBookings = [];
            updateStats([]);
            filterBy('ACTIVE');
        }
    }

    function updateStats(b) {
        document.getElementById('sTotal').textContent     = b.length;
        document.getElementById('sActive').textContent    = b.filter(x => x.status === 'ACTIVE').length;
        document.getElementById('sPending').textContent   = b.filter(x => x.status === 'PENDING').length;
        document.getElementById('sCancelled').textContent = b.filter(x => x.status === 'CANCELLED').length;
    }

    function filterBy(status) {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + status).classList.add('active');
        const filtered = status === 'ALL' ? allBookings : allBookings.filter(b => b.status === status);
        renderBookings(filtered, status);
    }

    function renderBookings(bookings, status) {
        const el = document.getElementById('content');
        if (!bookings.length) {
            el.innerHTML = `<div class="empty-state">
                <i class="bi bi-calendar-x"></i>
                <p>No ${status !== 'ALL' ? status.toLowerCase() : ''} bookings found</p>
                <a href="dashboard.html" class="nav-btn gold" style="display:inline-flex;height:40px;padding:0 20px">
                    <i class="bi bi-search"></i> Find a Slot
                </a>
            </div>`;
            return;
        }
        el.innerHTML = `<div class="bookings-grid">${bookings.map(bookingCard).join('')}</div>`;
    }

    function bookingCard(b) {
        const icon = b.status === 'PENDING' ? 'hourglass-split' : b.status === 'ACTIVE' ? 'check-circle-fill' : 'x-circle-fill';
        const footer = b.status === 'PENDING'
            ? `<div class="card-footer"><button class="cancel-btn" onclick="cancelBooking(${b.id})"><i class="bi bi-x-circle"></i> Cancel Booking</button></div>`
            : b.status === 'ACTIVE'
            ? `<div class="card-footer"><div class="active-badge"><i class="bi bi-check-circle-fill"></i> Currently Parked</div></div>`
            : '';
        return `
        <div class="booking-card">
            <div class="card-top">
                <div>
                    <div class="card-slot">${b.slotId}</div>
                    <div class="card-area"><i class="bi bi-building" style="margin-right:4px"></i>${b.parkingAreaName || 'Parking Area'}</div>
                </div>
                <div class="status-badge status-${b.status}"><i class="bi bi-${icon}"></i> ${b.status}</div>
            </div>
            <div class="card-body">
                <div class="detail-row">
                    <div class="detail-icon"><i class="bi bi-car-front-fill"></i></div>
                    <div><div class="detail-label">Vehicle Plate</div><div class="detail-value">${b.vehiclePlate}</div></div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="bi bi-layers-fill"></i></div>
                    <div><div class="detail-label">Floor</div><div class="detail-value">Floor ${b.floor ?? 0}</div></div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="bi bi-clock-fill"></i></div>
                    <div><div class="detail-label">Reserved At</div><div class="detail-value">${new Date(b.reservedAt).toLocaleString('en-KE')}</div></div>
                </div>
                ${b.expiresAt ? `<div class="detail-row"><div class="detail-icon"><i class="bi bi-hourglass-fill"></i></div><div><div class="detail-label">Expires At</div><div class="detail-value">${new Date(b.expiresAt).toLocaleString('en-KE')}</div></div></div>` : ''}
                ${b.totalAmount > 0 ? `<div class="detail-row"><div class="detail-icon"><i class="bi bi-cash-stack"></i></div><div><div class="detail-label">Amount</div><div class="detail-value" style="color:var(--green);font-weight:700">KES ${b.totalAmount}</div></div></div>` : ''}
            </div>
            ${footer}
        </div>`;
    }

    async function cancelBooking(id) {
        if (!confirm('Cancel this booking?')) return;
        try { await apiCancelBooking(id); } catch(e) {}
        loadBookings();
    }
</script>
</body>
</html>
